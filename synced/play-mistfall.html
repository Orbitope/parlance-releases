<script>window.__PARLANCE__={"project":{"skills":{"observation":{"cluster":"mind","description":"Seeing the one detail that is a degree out of place.","id":"observation","name":"Observation","voice":"Flat, patient, faintly pleased with itself."},"rhetoric":{"cluster":"mind","description":"Pressing a person until the shape of the lie shows.","id":"rhetoric","name":"Rhetoric","voice":"Warm on the surface. Not underneath."},"empathy":{"cluster":"heart","description":"Sitting with someone long enough that they fill the silence.","id":"empathy","name":"Empathy","voice":"Quiet. Never in a hurry."},"nerve":{"cluster":"body","description":"Holding still when the room would rather you did not.","id":"nerve","name":"Nerve","voice":"Says almost nothing. Does not look away."}},"variables":{"heard_the_room":{"default":false,"description":"The opening scene has played — set once, so it does not replay on re-entry.","id":"heard_the_room","kind":"flag"},"knows_poison":{"default":false,"description":"Established that Vane was poisoned rather than struck.","id":"knows_poison","kind":"flag"},"knows_foxglove":{"default":false,"description":"Identified the poison specifically as foxglove — the detail only a careful examination yields.","id":"knows_foxglove","kind":"flag"},"saw_torn_ledger":{"default":false,"description":"Noticed that a page has been torn out of Vane's assessment ledger.","id":"saw_torn_ledger","kind":"flag"},"saw_wet_boots":{"default":false,"description":"Noticed the wet bootprints leading from the yard door.","id":"saw_wet_boots","kind":"flag"},"knows_bragg_debt":{"default":false,"description":"Learned that Vane's assessment would have taken the inn for arrears.","id":"knows_bragg_debt","kind":"flag"},"knows_wren_dismissed":{"default":false,"description":"Learned that Wren was dismissed from Vane's service.","id":"knows_wren_dismissed","kind":"flag"},"knows_calloway_cargo":{"default":false,"description":"Learned that Vane seized Calloway's cargo at the Kelder toll.","id":"knows_calloway_cargo","kind":"flag"},"wren_cracked":{"default":false,"description":"Wren admitted he crossed the yard in the night.","id":"wren_cracked","kind":"flag"},"accused_wren":{"default":false,"description":"Named Aldous Wren to the militia.","id":"accused_wren","kind":"flag"},"accused_bragg":{"default":false,"description":"Named Sera Bragg to the militia.","id":"accused_bragg","kind":"flag"},"accused_calloway":{"default":false,"description":"Named Maud Calloway to the militia.","id":"accused_calloway","kind":"flag"},"named_no_one":{"default":false,"description":"Let dawn come without naming anyone.","id":"named_no_one","kind":"flag"},"evidence_count":{"default":0,"description":"Hard facts established. The militia will not act on fewer than three.","id":"evidence_count","kind":"counter"},"investigator_name":{"default":"the clerk","description":"What you gave as your name when Bragg asked. Substituted into later lines as {investigator_name}.","id":"investigator_name","kind":"text"}},"factions":{"fac_crown":{"id":"fac_crown","name":"The Crown Assessment","opposes":["fac_road"],"reputationRange":{"max":10,"min":-10},"summary":"The office Halloran Vane rode for. It values a bridge, a barn, or a life at whatever the ledger says."},"fac_road":{"id":"fac_road","name":"Road People","opposes":["fac_crown"],"reputationRange":{"max":10,"min":-10},"summary":"Carters, pedlars, innkeepers. Everyone whose living the assessment is currently pricing."}},"characters":{"npc_bragg":{"archetype":"innkeeper","description":"Broad, unhurried, and entirely unsurprised. Has already decided what she is willing to say.","dialogueStyle":"Short declaratives. Answers the question asked and not the one meant. Wipes something while she talks.","dialogues":[{"dialogue":"dlg_bragg_pressed","showIf":{"flag":"knows_bragg_debt","type":"flag","value":true}},{"dialogue":"dlg_bragg_first"}],"factionId":"fac_road","id":"npc_bragg","loreRef":{"file":"lore/mistfall.md"},"name":"Sera Bragg","portrait":"portrait_bragg","role":"Keeps the Mistfall. Has kept it nineteen years, most of them badly.","stats":{"empathy":6,"nerve":7}},"npc_calloway":{"archetype":"carter","description":"Wet to the shoulder and in no mood. Would rather be accused of the wrong crime than searched for the right one.","dialogueStyle":"Blunt, profane-adjacent, allergic to being handled. Respects a straight question.","dialogues":[{"dialogue":"dlg_calloway_pressed","showIf":{"flag":"knows_calloway_cargo","type":"flag","value":true}},{"dialogue":"dlg_calloway_first"}],"factionId":"fac_road","id":"npc_calloway","loreRef":{"file":"lore/mistfall.md"},"name":"Maud Calloway","portrait":"portrait_calloway","role":"Hauls freight over the Kelder. Was hauling rather more than freight this trip.","stats":{"nerve":8,"rhetoric":5}},"npc_wren":{"archetype":"apothecary","description":"Thin, courteous, and very tired. Keeps his hands where you can see them, which is itself a habit worth noticing.","dialogueStyle":"Over-explains. Offers detail nobody asked for, then hears himself doing it and stops.","dialogues":[{"dialogue":"dlg_wren_cornered","showIf":{"flag":"knows_wren_dismissed","type":"flag","value":true}},{"dialogue":"dlg_wren_first"}],"factionId":"fac_road","id":"npc_wren","loreRef":{"file":"lore/mistfall.md"},"name":"Aldous Wren","portrait":"portrait_wren","role":"Sells tinctures along the Kelder road. Was, until spring, a clerk of the assessment.","stats":{"observation":7,"rhetoric":4}}},"dialogues":{"dlg_accuse":{"entry":"node_dawn","id":"dlg_accuse","nodes":[{"choices":[{"goto":"node_wren_clean","id":"ch_wren_clean","showIf":{"flag":"wren_cracked","type":"flag","value":true},"text":"\"Aldous Wren. He'll tell you the rest himself.\""},{"goto":"node_wren_cold","id":"ch_wren_cold","text":"\"Aldous Wren.\""},{"goto":"node_bragg","id":"ch_bragg","text":"\"Sera Bragg. She poured it.\""},{"goto":"node_calloway","id":"ch_calloway","showIf":{"has":true,"item":"item_ledger_page","type":"item"},"text":"\"Maud Calloway. It was her cart.\""},{"goto":"node_none","id":"ch_none","text":"\"No one. Not on what I have.\""}],"id":"node_dawn","text":"The rain stops the way it started — all at once, as a decision. Grey comes up over the Kelder and with it, along the ford road, four riders of the county militia.\n\nThe sergeant puts his head in at the door, looks at the corner table, and then at you.\n\n\"Well?\" he says. \"Name one.\""},{"id":"node_wren_clean","isEnd":true,"onEnter":[{"flag":"accused_wren","type":"set_flag","value":true}],"text":"He does. On the step, to a sergeant who did not ask him to, in the same flat voice he used on you — the eleven shillings, the twelfth of the month, the page he could neither burn nor keep.\n\nThey take him down the ford road without irons, because nobody suggests them. At the turn he looks back at the inn, once, and then does not."},{"id":"node_wren_cold","isEnd":true,"onEnter":[{"flag":"accused_wren","type":"set_flag","value":true}],"text":"The sergeant looks at Wren, and Wren looks at the floor of the common room, and says nothing at all — which the sergeant, who has a long ride and a dry bed at the end of it, takes for the thing it probably is.\n\nThey take him. He does not explain himself to anyone, then or later, and the record of the Mistfall inquest is four lines long."},{"id":"node_bragg","isEnd":true,"onEnter":[{"flag":"accused_bragg","type":"set_flag","value":true}],"text":"\"I poured it,\" Bragg agrees, when asked, because it is true and because she said it to you first and will not now unsay it.\n\nThat is enough for a sergeant with a long ride. She goes without argument and without looking at anyone, and the Mistfall stands empty on the Kelder road with its door unbarred, which by autumn is the same thing as the Crown having it after all."},{"id":"node_calloway","isEnd":true,"onEnter":[{"flag":"accused_calloway","type":"set_flag","value":true}],"text":"You give them the page and the cart it came out of, and the page has a name on it that is not hers, and the sergeant reads it twice.\n\nBut it was her cart, and forty pounds of undeclared tin is on the record at the Kelder toll, and the militia has been up since three. They take her. On the ford road she says one thing, to you: \"You had it in your hand.\""},{"id":"node_none","isEnd":true,"onEnter":[{"flag":"named_no_one","type":"set_flag","value":true}],"text":"\"No one,\" you say. \"Not on what I have.\"\n\nThe sergeant looks at you for a while, and then writes something short, and then they load Halloran Vane onto the cart they brought for exactly that purpose.\n\nBy noon the ford is passable and the Mistfall is empty. The apothecary goes north. The carter goes south with an empty bed and her year in someone's book. Bragg opens at six, as she has for nineteen years, for as long as the arrears allow.\n\nNobody is hanged for it. That is not nothing."}],"tags":["ending"],"title":"First Light"},"dlg_arrival":{"entry":"node_open","id":"dlg_arrival","nodes":[{"id":"node_open","next":"node_asks","text":"The Kelder bridge went out at midnight and took the road with it. Five of you sat out the rest of the storm in the Mistfall's common room. Now it is four in the morning, the fire is down to a red seam, and Halloran Vane of the Crown Assessment is face-down at the corner table with his wine gone cold beside him.\n\nThe innkeeper is standing very still behind the bar, looking at you rather than at him."},{"choices":[{"effects":[{"type":"set_text","value":"the clerk","variable":"investigator_name"}],"goto":"node_terms","id":"ch_name_clerk","text":"\"Clerk. That'll do.\""},{"effects":[{"type":"set_text","value":"Roque","variable":"investigator_name"}],"goto":"node_terms","id":"ch_name_full","text":"\"Ansel Roque. Third circuit.\""},{"effects":[{"type":"set_text","value":"you","variable":"investigator_name"}],"goto":"node_terms","id":"ch_name_none","text":"Say nothing, and look at the body instead."}],"id":"node_asks","speakerId":"npc_bragg","text":"\"You ride for the magistrate. That makes you the nearest thing to law between here and Kelder.\" She sets down the cloth. \"Road opens at first light and the militia comes up with it. Whoever you give them, they'll take. So — what do I call you?\""},{"id":"node_terms","isEnd":true,"onEnter":[{"flag":"heard_the_room","type":"set_flag","value":true}],"speakerId":"npc_bragg","text":"\"Right.\" A short nod, as though something had been agreed. \"Then I'll tell you what I told myself when I found him, {investigator_name}. Nobody left this house tonight. The water's over the ford both ways.\"\n\nWhich means it was one of the four of you still breathing."}],"tags":["scene","opening"],"title":"The Room at Four in the Morning"},"dlg_bragg_first":{"entry":"node_bar","id":"dlg_bragg_first","nodes":[{"choices":[{"goto":"node_arrears","id":"ch_why","text":"\"Why would you say that first?\""},{"check":{"difficulty":10,"mode":"active","onFailure":"node_shut","onSuccess":"node_arrears","skill":"rhetoric"},"id":"ch_press","text":"\"Then you'd better tell me the rest of it.\""}],"id":"node_bar","onEnter":[{"flag":"knows_bragg_debt","type":"set_flag","value":true},{"counter":"evidence_count","delta":1,"type":"adjust_counter"}],"text":"\"He took the corner table at seven and the wine at nine.\" She is drying a cup that has been dry for some time. \"I poured it. I'll say that before you ask, because you'd have got there.\""},{"id":"node_arrears","next":"node_lantern","text":"\"Because the book on that table has nineteen years of my arrears in it, and by Michaelmas this house would have been the Crown's.\" She sets the cup down. \"So I had it worse than anyone here, and I'd rather you heard that from me than worked it out and got pleased with yourself.\""},{"id":"node_shut","next":"node_lantern","text":"\"The rest of it.\" She looks at you for slightly too long. \"The rest of it is that he was going to have this house off me by Michaelmas, and every soul under this roof knew it, and you'd have had that out of the book in five minutes anyway.\"\n\nYou have the fact. You have also spent something to get it, and she has taken your measure."},{"id":"node_lantern","isEnd":true,"onEnter":[{"item":"item_lantern","type":"give_item"}],"text":"\"You'll want the yard before the rain has the whole of it.\" She reaches under the bar and puts a stable lantern on the wood between you. \"Bring it back lit.\""}],"speakerId":"npc_bragg","tags":["suspect"],"title":"Bragg — The Arrears"},"dlg_bragg_pressed":{"entry":"node_again","id":"dlg_bragg_pressed","nodes":[{"choices":[{"goto":"node_who","id":"ch_who_up","text":"\"Who was still up after you turned in?\""},{"goto":"node_wine","id":"ch_wine","text":"\"Who else went near that cup?\""},{"check":{"difficulty":11,"mode":"active","onFailure":"node_nothing","onSuccess":"node_soft","skill":"empathy"},"id":"ch_read_her","text":"Say nothing. Let the silence do it."},{"goto":"node_done","id":"ch_done","text":"Leave her to the bar."}],"id":"node_again","text":"\"Back again, {investigator_name}.\" She does not stop what she is doing. \"Ask.\""},{"id":"node_who","next":"node_ask_more","text":"\"The carter went up angry and stayed up angry — I could hear the floor. The apothecary sat where he always sits.\" A pause exactly one beat too long. \"For a while.\""},{"id":"node_wine","next":"node_ask_more","text":"\"I poured it and I carried it and I set it down. After that it sat by his elbow for two hours with the whole room walking past it.\" She shrugs. \"That's not an answer. It's the truth, though.\""},{"id":"node_soft","isEnd":true,"speakerId":"empathy","text":"She is not frightened of being taken for the killer. She is frightened of being taken for a woman who would let a neighbour hang for her arrears — which means she has already thought about who else it could be, and arrived somewhere, and does not like it.\n\n\"Wren,\" she says, to the cup. \"He came back in wet. I didn't ask from where.\""},{"id":"node_nothing","isEnd":true,"text":"The silence goes on. She lets it, because she has kept a public house for nineteen years and silence is a thing she sells.\n\n\"Was there something else?\" she says pleasantly, and you have lost the moment."},{"choices":[{"goto":"node_wet","id":"ch_for_a_while","text":"\"For a while?\""},{"goto":"node_done","id":"ch_enough","text":"\"That's enough for now.\""}],"id":"node_ask_more","text":"She waits, in the way of someone who will answer exactly one more question and has decided which."},{"id":"node_wet","isEnd":true,"text":"\"For a while,\" she agrees. \"And then he wasn't in his chair. And then he was again, and there was water off him onto my floor.\" She finally looks up. \"I'd have said that whether you'd found the boots or not.\""},{"id":"node_done","isEnd":true,"text":"She returns to the cup, which is still dry."}],"speakerId":"npc_bragg","tags":["suspect"],"title":"Bragg — Who Was Up"},"dlg_calloway_first":{"entry":"node_yard","id":"dlg_calloway_first","nodes":[{"choices":[{"goto":"node_glad","id":"ch_glad","text":"\"Glad.\""},{"check":{"difficulty":11,"mode":"active","onFailure":"node_stays","onSuccess":"node_out","skill":"nerve"},"id":"ch_out","text":"\"Come out from under the cart.\""}],"id":"node_yard","onEnter":[{"flag":"knows_calloway_cargo","type":"set_flag","value":true},{"counter":"evidence_count","delta":1,"type":"adjust_counter"}],"text":"She is under the cart with a strap in her teeth, in the rain, at four in the morning, and does not come out when she hears you.\n\n\"If you're here about the dead man,\" she says around the strap, \"I was asleep, I'm glad, and I'd have done it cheaper.\""},{"id":"node_glad","next":"node_end","text":"\"Glad.\" The strap comes out of her teeth. \"He took forty pounds of undeclared tin off me at the Kelder toll on Tuesday and wrote it in his little book, and that tin was three months of the year. So yes. Glad. Write that down.\""},{"id":"node_out","next":"node_end","text":"She comes out. Slowly, and streaming, and looking at you with a kind of grudging recalculation.\n\n\"Forty pounds of tin,\" she says. \"Undeclared, off the back of this cart, at the Kelder toll on Tuesday. In his book. Three months of my year in his book.\" She wipes her face. \"That's my motive. You'd have found it. Now ask me the other thing.\""},{"id":"node_stays","next":"node_end","text":"She does not come out. The strap goes back between her teeth.\n\n\"Tin,\" she says. \"Forty pound of it, off this cart, Tuesday, and in his book. There's your reason and you can have it standing in the rain like everyone else.\""},{"id":"node_end","isEnd":true,"text":"Rain runs off the cart's edge between you in a line."}],"speakerId":"npc_calloway","tags":["suspect"],"title":"Calloway — The Seizure"},"dlg_calloway_pressed":{"entry":"node_back","id":"dlg_calloway_pressed","nodes":[{"choices":[{"goto":"node_search","id":"ch_search","text":"\"I want to search the cart.\""},{"goto":"node_night","id":"ch_night","text":"\"Did anyone come out here tonight?\""},{"goto":"node_go","id":"ch_go","text":"Leave her to the wheel."}],"id":"node_back","text":"\"Back.\" She has got the strap fixed and is now doing something unnecessary to a wheel, in order not to go inside. \"Ask the other thing.\""},{"id":"node_search","isEnd":true,"text":"\"Course you do.\" She steps back from the cart and makes a flat, disgusted gesture at the whole of it. \"Everyone wants in this cart. He wanted in this cart. Go on, then — there's nothing in it now but sacking and the rest of my year.\""},{"id":"node_night","isEnd":true,"text":"\"Someone did.\" She says it without any pleasure at all. \"I heard the yard door twice and I didn't get up, because I assumed it was the assessment coming back for the wheels.\" She looks at the house. \"Twice. Out and in.\""},{"id":"node_go","isEnd":true,"text":"She goes back to the wheel that does not need her."}],"speakerId":"npc_calloway","tags":["suspect"],"title":"Calloway — The Cart"},"dlg_examine_body":{"entry":"node_body","id":"dlg_examine_body","nodes":[{"choices":[{"check":{"difficulty":9,"mode":"active","onFailure":"node_poison","onSuccess":"node_foxglove","skill":"observation"},"id":"ch_examine","showIf":{"flag":"knows_poison","type":"flag","value":false},"text":"Go over him properly."},{"goto":"node_recall","id":"ch_recall","showIf":{"flag":"knows_poison","type":"flag","value":true},"text":"Look again at what you already found."},{"goto":"node_leave","id":"ch_leave","text":"Leave him as he is."}],"id":"node_body","text":"He has been dead some hours. No wound you can see, no disarray beyond the chair pushed back. His right hand is still curled where the cup would have been."},{"id":"node_foxglove","isEnd":true,"onEnter":[{"flag":"knows_poison","type":"set_flag","value":true},{"flag":"knows_foxglove","type":"set_flag","value":true},{"counter":"evidence_count","delta":1,"type":"adjust_counter"}],"speakerId":"observation","text":"The lips have gone the colour of a bruise, and there is a sediment in the cup's heel — dried, faintly furred. Foxglove. Steeped and strained badly by someone in a hurry. You would know it anywhere; so would anyone who sells tinctures for a living."},{"id":"node_poison","isEnd":true,"onEnter":[{"flag":"knows_poison","type":"set_flag","value":true},{"counter":"evidence_count","delta":1,"type":"adjust_counter"}],"text":"No wound, no bruising at the throat, nothing under the nails. Whatever took him was in him rather than done to him — you are sure of that much and no more. The cup holds a residue you cannot name, and naming it is exactly the thing that would have been useful."},{"id":"node_recall","isEnd":true,"text":"Nothing has changed. He is still a man who drank something, and still not saying what."},{"id":"node_leave","isEnd":true,"text":"You leave him the little dignity the angle of the chair allows."}],"tags":["object"],"title":"Halloran Vane"},"dlg_examine_ledger":{"entry":"node_ledger","id":"dlg_examine_ledger","nodes":[{"choices":[{"goto":"node_torn","id":"ch_read","showIf":{"flag":"saw_torn_ledger","type":"flag","value":false},"text":"Read back through the last few days."},{"goto":"node_recall","id":"ch_recall","showIf":{"flag":"saw_torn_ledger","type":"flag","value":true},"text":"Check the stub again."},{"goto":"node_leave","id":"ch_leave","text":"Close it."}],"id":"node_ledger","text":"Vane's ledger lies open at the table's far edge, out of the wine's reach. Columns of holdings, valuations, arrears. A working man's book, kept beautifully."},{"id":"node_torn","isEnd":true,"onEnter":[{"flag":"saw_torn_ledger","type":"set_flag","value":true},{"counter":"evidence_count","delta":1,"type":"adjust_counter"}],"text":"Kelder toll, a seizure of undeclared goods. The Mistfall, nineteen years of arrears totalled in a hand that did not hesitate. Then — between the eleventh and the thirteenth — a stub. A page has been torn out close to the binding, recently and not carefully."},{"id":"node_recall","isEnd":true,"text":"The stub is where it was. Whatever the twelfth held, it is not in this room."},{"id":"node_leave","isEnd":true,"text":"You close the book on the dead man's handwriting."}],"tags":["object"],"title":"The Assessment Ledger"},"dlg_search_cart":{"entry":"node_cart","id":"dlg_search_cart","nodes":[{"choices":[{"check":{"difficulty":8,"mode":"active","onFailure":"node_slow","onSuccess":"node_found","skill":"observation"},"id":"ch_search","showIf":{"has":false,"item":"item_ledger_page","type":"item"},"text":"Go through it."},{"goto":"node_recall","id":"ch_recall","showIf":{"has":true,"item":"item_ledger_page","type":"item"},"text":"You have already taken what was here."},{"goto":"node_leave","id":"ch_leave","text":"Get out of the rain."}],"id":"node_cart","text":"Calloway's cart, roped under sacking, standing in four inches of yard water. The lantern throws more shadow than light, but it throws it where you want it."},{"id":"node_found","isEnd":true,"onEnter":[{"item":"item_ledger_page","type":"give_item"},{"counter":"evidence_count","delta":1,"type":"adjust_counter"}],"text":"Under the sacking, forced down between two boards where the wet has not reached: a single ledger page, folded twice, torn close to the binding.\n\nThe twelfth of the month. Vane's hand. A note of eleven shillings paid to a clerk of the assessment for figures, and the clerk named."},{"id":"node_slow","isEnd":true,"onEnter":[{"item":"item_ledger_page","type":"give_item"},{"counter":"evidence_count","delta":1,"type":"adjust_counter"}],"text":"You go through it twice in the rain with a lantern that keeps guttering, and you find it in the end — folded down between two boards under the sacking — but you are wet through and the sky over the Kelder has started to go grey while you worked.\n\nThe twelfth of the month. Vane's hand. Eleven shillings paid to a clerk of the assessment for figures, and the clerk named."},{"id":"node_recall","isEnd":true,"text":"Sacking, rope, water. The cart has given up everything it had."},{"id":"node_leave","isEnd":true,"text":"You leave the cart to the weather."}],"tags":["object"],"title":"The Cart"},"dlg_wren_cornered":{"entry":"node_corner","id":"dlg_wren_cornered","nodes":[{"choices":[{"goto":"node_press","id":"ch_boots","showIf":{"flag":"saw_wet_boots","type":"flag","value":true},"text":"\"Someone crossed the yard tonight and came back in.\""},{"goto":"node_page","id":"ch_page","showIf":{"has":true,"item":"item_ledger_page","type":"item"},"text":"Hold up the torn page without a word."},{"goto":"node_foxglove","id":"ch_foxglove","showIf":{"flag":"knows_foxglove","type":"flag","value":true},"text":"\"Foxglove. Steeped badly, by someone in a hurry.\""},{"goto":"node_wait","id":"ch_wait","text":"Sit down on the step below him and say nothing."}],"id":"node_corner","text":"He has not moved from the step. He watches you come up the stairs and something in his face gets ready."},{"id":"node_press","next":"node_choose","text":"\"In the rain,\" he agrees. \"Yes. Someone did.\" His hands stay exactly where they are on the case."},{"id":"node_page","next":"node_choose","text":"He looks at it for a long moment — at the torn edge, mostly, rather than the writing.\n\n\"That was in the cart,\" he says. \"Wasn't it.\""},{"id":"node_foxglove","next":"node_choose","text":"\"Badly,\" he repeats, and something goes out of him. \"Yes. It was badly done. I've thought about that more than I've thought about him.\""},{"choices":[{"check":{"difficulty":12,"mode":"active","onFailure":"node_hold","onSuccess":"node_break","skill":"rhetoric"},"id":"ch_finish","text":"\"Say the rest, Aldous.\""},{"check":{"difficulty":10,"mode":"active","onFailure":"node_hold","onSuccess":"node_break","skill":"empathy"},"id":"ch_gentle","text":"\"You've been composing it all night. Let's hear it.\""},{"goto":"node_stop","id":"ch_stop","text":"Leave it there. You have enough."}],"id":"node_choose","text":"The stair creaks under the weight of the pause."},{"id":"node_wait","isEnd":true,"text":"You sit. Below him, which he notices. The house ticks and settles around the two of you and he does not fill the silence, because he is a man who has spent four years in an office learning not to.\n\nEventually: \"You should look in the yard,\" he says. \"If you haven't.\""},{"id":"node_break","isEnd":true,"onEnter":[{"flag":"wren_cracked","type":"set_flag","value":true},{"counter":"evidence_count","delta":1,"type":"adjust_counter"}],"text":"\"The twelfth of the month,\" he says. \"He wrote on the twelfth that I'd sold assessment figures to a carter at the Kelder toll. Which I had. One time, for eleven shillings, because I hadn't eaten.\" His voice does not rise at all. \"That page was going to Kelder with him at first light, and then I would not have been a man without a character. I'd have been a man with one.\"\n\nHe sets the case down on the step beside him, finally.\n\n\"I put the page in her cart because I could not make myself burn it and I could not make myself keep it. That is the whole of what I did that I'm ashamed of.\""},{"id":"node_hold","isEnd":true,"text":"\"The rest,\" he says, \"is that I went out to the yard, and I came back in, and I have told you that.\" He is shaking, faintly and continuously, and he does not say another word.\n\nHe has given you the yard. He has not given you the reason, and you can feel the door closing on it."},{"id":"node_stop","isEnd":true,"text":"You leave him on the step with the case across his knees, composing."}],"speakerId":"npc_wren","tags":["suspect","climax"],"title":"Wren — The Yard"},"dlg_wren_first":{"entry":"node_landing","id":"dlg_wren_first","nodes":[{"choices":[{"goto":"node_knew","id":"ch_knew_him","text":"\"You knew him.\""},{"goto":"node_case","id":"ch_case","text":"\"What's in the case?\""}],"id":"node_landing","onEnter":[{"flag":"knows_wren_dismissed","type":"set_flag","value":true},{"counter":"evidence_count","delta":1,"type":"adjust_counter"}],"text":"He is sitting on the top step with his case across his knees, fully dressed, at four in the morning.\n\n\"I couldn't,\" he says, before you ask. \"Sleep. With him down there. I know how that sounds. I've been sitting here composing how it sounds.\""},{"id":"node_knew","next":"node_close","onEnter":[{"character":"npc_wren","delta":1,"type":"adjust_relationship"}],"text":"\"I clerked for him. Four years.\" He says it the way you say a thing you have decided to say first. \"He let me go in the spring. Without a character, which in that office means without a trade. Hence —\" a small motion at the case \"— tinctures.\""},{"id":"node_case","next":"node_close","text":"\"Tinctures. Willow, valerian, a little laudanum I'm licensed for.\" He opens it without being asked, which is either candour or rehearsal. \"I clerked for him once. He let me go in the spring, without a character. This is what's left.\""},{"id":"node_close","isEnd":true,"text":"He closes the case with both hands, carefully, the way you close something you have opened a great many times tonight."}],"speakerId":"npc_wren","tags":["suspect"],"title":"Wren — The Dismissal"},"dlg_yard_dark":{"entry":"node_dark","id":"dlg_yard_dark","nodes":[{"id":"node_dark","isEnd":true,"text":"You get two steps into the yard before the dark and the rain agree that this is pointless. The cart is a shape. The stable is a darker shape. You would need a light, and Bragg has the only one that still works."}],"tags":["denial"],"title":"Too Dark to Search"},"dlg_yard_door":{"entry":"node_door","id":"dlg_yard_door","nodes":[{"choices":[{"goto":"node_prints","id":"ch_look","showIf":{"flag":"saw_wet_boots","type":"flag","value":false},"text":"Crouch and look at the floor."},{"goto":"node_recall","id":"ch_recall","showIf":{"flag":"saw_wet_boots","type":"flag","value":true},"text":"Look at the prints again."},{"goto":"node_leave","id":"ch_leave","text":"Straighten up."}],"id":"node_door","text":"The door to the stable yard is shut against the weather, and the boards in front of it are dark with water."},{"id":"node_prints","isEnd":true,"onEnter":[{"flag":"saw_wet_boots","type":"set_flag","value":true},{"counter":"evidence_count","delta":1,"type":"adjust_counter"}],"text":"Not spill. Prints — in, not out, and only the one set, drying at the edges. Someone crossed the yard in the rain tonight and came back through this door, and it was long enough ago that the water has had time to think about leaving."},{"id":"node_recall","isEnd":true,"text":"One set. Inward. Still the wrong number of people to have been outside tonight."},{"id":"node_leave","isEnd":true,"text":"You leave the door shut."}],"tags":["object"],"title":"The Yard Door"}},"quests":{"qst_inquest":{"id":"qst_inquest","journalName":"One Night at the Mistfall","loreRef":{"file":"lore/mistfall.md"},"name":"The Mistfall Inquest","outcomes":[{"description":"Wren was named, and Wren did it.","effects":[{"amount":150,"type":"grant_xp"}],"id":"out_right","kind":"success","reachedWhen":{"flag":"accused_wren","type":"flag","value":true}},{"description":"Someone was taken down the ford road who had not poisoned anybody.","effects":[{"amount":50,"type":"grant_xp"}],"id":"out_wrong","kind":"failure","reachedWhen":{"of":[{"flag":"accused_bragg","type":"flag","value":true},{"flag":"accused_calloway","type":"flag","value":true}],"type":"any"}},{"description":"No name was given and no one was hanged for it.","effects":[{"amount":100,"type":"grant_xp"}],"id":"out_silent","kind":"neutral","reachedWhen":{"flag":"named_no_one","type":"flag","value":true}}],"stages":[{"completeWhen":{"flag":"knows_poison","type":"flag","value":true},"description":"I established that Vane was poisoned rather than struck.","id":"stg_body","objectives":[{"id":"ob_body","text":"Go over the body properly before anyone else decides what happened to it."},{"id":"ob_ledger","text":"Read the ledger he was working in when he died."}],"order":1},{"completeWhen":{"counter":"evidence_count","op":">=","type":"counter","value":3},"description":"I put three hard facts together before the road opened.","id":"stg_gather","objectives":[{"id":"ob_ask","text":"Get each of the three of them to tell me why they are glad he is dead."},{"id":"ob_yard","showIf":{"flag":"saw_wet_boots","type":"flag","value":true},"text":"Find out who crossed the yard in the rain tonight."}],"order":2},{"completeWhen":{"of":[{"flag":"accused_wren","type":"flag","value":true},{"flag":"accused_bragg","type":"flag","value":true},{"flag":"accused_calloway","type":"flag","value":true},{"flag":"named_no_one","type":"flag","value":true}],"type":"any"},"description":"I gave the sergeant a name, or I did not.","id":"stg_name","objectives":[{"id":"ob_name","text":"Decide what I am willing to say out loud to a sergeant in a hurry."}],"order":3}],"startsAvailable":true,"summary":"Halloran Vane died at the corner table some time before four in the morning. The ford opens at first light and the militia will take whoever you name.","tags":["main","act1"]}},"locations":{"loc_common_room":{"description":"Low beams, a dying fire, and a corner table nobody is sitting at any more.","exits":[{"id":"ex_upstairs","to":{"location":"loc_landing","spawn":"sp_stairs_top"}},{"denialDialogue":"dlg_yard_dark","gate":{"has":true,"item":"item_lantern","type":"item"},"gateType":"act_gate","id":"ex_yard","to":{"location":"loc_stable_yard","spawn":"sp_yard_gate"}}],"id":"loc_common_room","interactables":[{"dialogue":"dlg_arrival","id":"int_opening","kind":"object","showIf":{"flag":"heard_the_room","type":"flag","value":false},"trigger":"on_enter"},{"dialogue":"dlg_examine_body","id":"int_body","kind":"object"},{"dialogue":"dlg_examine_ledger","id":"int_ledger","kind":"object"},{"dialogue":"dlg_yard_door","id":"int_yard_door","kind":"object"},{"character":"npc_bragg","id":"int_bragg","kind":"npc"},{"dialogue":"dlg_accuse","id":"int_militia","kind":"object","showIf":{"counter":"evidence_count","op":">=","type":"counter","value":3},"trigger":"on_enter"}],"name":"The Common Room","spawns":[{"id":"sp_hearth","isDefault":true},{"id":"sp_stairs_foot"},{"id":"sp_yard_door"}],"tags":["start"],"zone":"zone_inn"},"loc_landing":{"description":"Three guest doors, two of them shut, and a man sitting on the top step with his case.","exits":[{"id":"ex_down","to":{"location":"loc_common_room","spawn":"sp_stairs_foot"}}],"id":"loc_landing","interactables":[{"character":"npc_wren","id":"int_wren","kind":"npc"}],"name":"The Upstairs Landing","spawns":[{"id":"sp_stairs_top"}],"zone":"zone_inn"},"loc_stable_yard":{"description":"Four inches of standing water, a roped cart, and the Kelder somewhere out in the dark being far too loud.","exits":[{"id":"ex_inside","to":{"location":"loc_common_room","spawn":"sp_yard_door"}}],"id":"loc_stable_yard","interactables":[{"dialogue":"dlg_search_cart","id":"int_cart","kind":"object"},{"character":"npc_calloway","id":"int_calloway","kind":"npc"}],"name":"The Stable Yard","spawns":[{"id":"sp_yard_gate"}],"zone":"zone_yard"}},"endings":{"ending_nearest_hand":{"id":"ending_nearest_hand","kind":"failure","name":"The Nearest Hand","summary":"The militia takes someone who did not do it, on evidence that looked enough like it at first light. The inquest record is four lines long and none of them are wrong, exactly.","tags":["ending"],"unlockedBy":{"outcome":"out_wrong","quest":"qst_inquest","type":"questOutcome"}},"ending_no_name":{"id":"ending_no_name","kind":"neutral","name":"No Name Given","summary":"The ford opens, the house empties, and nobody hangs for Halloran Vane. Whether that is mercy or failure is left, deliberately, to you.","tags":["ending"],"unlockedBy":{"outcome":"out_silent","quest":"qst_inquest","type":"questOutcome"}},"ending_the_page":{"id":"ending_the_page","kind":"success","name":"The Twelfth of the Month","summary":"Aldous Wren goes down the ford road for eleven shillings and a page he could neither burn nor keep. The right answer, which is not the same as a good morning.","tags":["ending"],"unlockedBy":{"outcome":"out_right","quest":"qst_inquest","type":"questOutcome"}}},"codex":{"codex_foxglove":{"body":"Tall, purple, common in hedgerows. Beautiful, and fatal in quantity — the symptoms read as a bad heart to anyone not looking for poison. Knowing that is not the same as proving who knew it.","category":"evidence","id":"codex_foxglove","name":"Foxglove","tags":["act1"],"unlockedBy":{"of":[{"op":">=","quest":"qst_inquest","stage":"stg_gather","type":"quest"},{"character":"npc_wren","op":">=","type":"relationship","value":1}],"type":"all"}},"codex_the_mistfall_inn":{"body":"Three floors, nine rooms, one road in. The mist comes off the fen most evenings and the inn is the only lit thing in it for an hour's walk. That is why people stop here, and why nobody leaves in a hurry.","category":"places","id":"codex_the_mistfall_inn","name":"The Mistfall Inn","tags":["act1"]}},"items":{"item_lantern":{"description":"Bragg's stable lantern. Without it the yard is unsearchable in the dark.","id":"item_lantern","name":"Stable Lantern"},"item_ledger_page":{"description":"The page torn from Vane's ledger, found hidden in Calloway's cart.","id":"item_ledger_page","name":"Torn Ledger Page"}},"portraits":{"portrait_bragg":{"character":"npc_bragg","id":"portrait_bragg","name":"Sera Bragg","tags":["named"]},"portrait_wren":{"character":"npc_wren","id":"portrait_wren","name":"Aldous Wren","tags":["named"]},"portrait_calloway":{"character":"npc_calloway","id":"portrait_calloway","name":"Maud Calloway","tags":["named"]}},"cutscenes":{},"routes":{"rt_body_examined":{"assertEnd":{"flags":{"knows_foxglove":true,"knows_poison":true}},"description":"Passing the Observation check on the body names the poison, not just the fact of it.","dialogueId":"dlg_examine_body","id":"rt_body_examined","steps":[{"choiceId":"ch_examine","forced":"pass"}]},"rt_body_failed":{"assertEnd":{"flags":{"knows_poison":true},"forbiddenFlags":["knows_foxglove"]},"description":"The priced check pays its way: failing still establishes the poisoning, and only costs the detail. If this route ever ends with knows_poison false, the check has stopped being priced and become a wall.","dialogueId":"dlg_examine_body","id":"rt_body_failed","steps":[{"choiceId":"ch_examine","forced":"fail"}]},"rt_no_name":{"assertEnd":{"endingAvailable":"ending_no_name","flags":{"named_no_one":true}},"description":"Refusing to name anyone reaches the neutral ending rather than dead-ending.","dialogueId":"dlg_accuse","id":"rt_no_name","steps":[{"choiceId":"ch_none"}]},"rt_wren_breaks":{"assertEnd":{"flags":{"wren_cracked":true}},"description":"The wet bootprints open the confession: boots, the pause, then Rhetoric.","dialogueId":"dlg_wren_cornered","id":"rt_wren_breaks","startState":{"flags":{"knows_wren_dismissed":true,"saw_wet_boots":true}},"steps":[{"choiceId":"ch_boots"},{"advance":1},{"choiceId":"ch_finish","forced":"pass"}]}},"snapshots":{},"progression":{"maxSkill":8,"pointsPerLevel":1,"startingSkills":{"empathy":2,"nerve":2,"observation":3,"rhetoric":2},"xpThresholds":[0,100,250,450,700]}},"start":"dlg_examine_body","title":"Halloran Vane"}</script>
