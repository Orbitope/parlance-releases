  <text x="600" y="345" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="600" letter-spacing="-1.5" fill="#e0ebeb">Parlance</text>
  <text x="600" y="418" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#b4c6c8">Git-native narrative design for story-driven games</text>
  <text x="600" y="468" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8fa4a8">Schema-first · Engine-agnostic · Your story is plain JSON in your repo</text>
